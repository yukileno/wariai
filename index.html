<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>関係図トレーニング｜割合の文章題</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 36 36" width="30" height="30">
            <rect x="2" y="11" width="12" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
            <rect x="22" y="11" width="12" height="14" rx="3" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
            <path d="M14.5 18 H20.5" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
            <path d="M18.5 15 L21.5 18 L18.5 21" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="18" y="9" text-anchor="middle" font-size="7" font-weight="bold" fill="#0369a1">×□</text>
          </svg>
        </div>
        <h1>関係図トレーニング</h1>
      </div>

      <div class="stats-bar">
        <span class="stat-pill">正解: <strong id="stat-solved">0</strong></span>
        <span class="stat-pill">れんぞく: <strong id="stat-streak">0</strong> 🔥</span>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="practice-container">
      <div class="category-pills" role="group" aria-label="問題のしゅるい">
        <button type="button" class="pill-btn active" data-cat="all">すべて</button>
        <button type="button" class="pill-btn" data-cat="ratio">① 割合</button>
        <button type="button" class="pill-btn" data-cat="compared">② くらべる量</button>
        <button type="button" class="pill-btn" data-cat="base">③ もとにする量</button>
        <button type="button" class="pill-btn" data-cat="tricky">④ ひっかけ</button>
        <button type="button" class="pill-btn pill-gen" data-cat="generated">🎲 自動生成</button>
      </div>

      <div class="practice-card">
        <div class="problem-header">
          <span id="p-badge" class="problem-badge">レベル1・割合を求める</span>
          <span id="p-counter" class="problem-counter">問題 1 / 12</span>
          <div class="problem-header-actions">
            <button type="button" id="btn-p-hint" class="mini-btn hint-btn">💡 ヒント</button>
          </div>
        </div>

        <div id="p-question-box" class="p-question-box"></div>
        <div id="p-hint-box" class="p-hint-box hidden"></div>

        <!-- Step 1: Build the 関係図 -->
        <div class="practice-step">
          <div class="step-heading">
            <span class="step-num">1</span>
            <h3>関係図を組み立てよう</h3>
            <button type="button" id="btn-p-swap" class="mini-btn">⇄ 左右いれかえ</button>
            <button type="button" id="btn-p-reset" class="mini-btn">やりなおす</button>
          </div>

          <div class="builder-board" id="builder-board">
            <div class="builder-col">
              <div class="role-tag tag-base">もとにする量</div>
              <div class="drop-slot slot-box slot-base" data-slot="baseLabel" tabindex="0">
                <span class="slot-placeholder">なまえ</span>
              </div>
              <div class="drop-slot slot-val" data-slot="baseVal" tabindex="0">
                <span class="slot-placeholder">数量・□</span>
              </div>
            </div>

            <div class="builder-arrow-col">
              <div class="role-tag tag-ratio">割合</div>
              <div class="drop-slot slot-ratio" data-slot="ratioVal" tabindex="0">
                <span class="slot-placeholder">何倍・□倍</span>
              </div>
              <div class="builder-arrow-graphic" aria-hidden="true">
                <div class="arrow-shaft"></div>
                <div class="arrow-head"></div>
              </div>
            </div>

            <div class="builder-col">
              <div class="role-tag tag-compared">くらべる量</div>
              <div class="drop-slot slot-box slot-compared" data-slot="comparedLabel" tabindex="0">
                <span class="slot-placeholder">なまえ</span>
              </div>
              <div class="drop-slot slot-val" data-slot="comparedVal" tabindex="0">
                <span class="slot-placeholder">数量・□</span>
              </div>
            </div>
          </div>

          <div id="p-card-tray" class="card-tray" aria-label="カード"></div>

          <div class="step-actions">
            <button type="button" id="btn-check-diagram" class="btn-primary btn-lg">関係図をチェック</button>
          </div>
          <div id="p-diagram-feedback" class="feedback-box hidden"></div>
        </div>

        <!-- Step 2: Equation & Answer -->
        <div id="practice-step-2" class="practice-step step-locked">
          <div class="step-heading">
            <span class="step-num">2</span>
            <h3>式と答えを求めよう</h3>
          </div>

          <div id="p-aux-preview" class="p-aux-preview"></div>

          <div class="equation-builder">
            <div class="eq-row">
              <label for="in-p-eq">式：</label>
              <input type="text" id="in-p-eq" placeholder="例: 24 ÷ 1.6" autocomplete="off" />
              <div class="eq-quick-btns" id="eq-quick-btns"></div>
            </div>
            <div class="eq-row">
              <label for="in-p-ans">答え：</label>
              <input type="text" id="in-p-ans" placeholder="数値" autocomplete="off" />
              <span id="p-ans-unit" class="ans-unit"></span>
              <button type="button" id="btn-check-answer" class="btn-accent">答え合わせ</button>
            </div>
          </div>
          <div id="p-answer-feedback" class="feedback-box hidden"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/diagram.js"></script>
  <script src="js/problems.js"></script>
  <script src="js/practice.js"></script>
</body>
</html>
